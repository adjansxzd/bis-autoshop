<header class="bar">
  <a routerLink="/" class="logo" aria-label="BIS AutoShop home">
    <span class="logo-mark">BIS</span><span class="logo-word">AUTO<b>SHOP</b></span>
  </a>

  <form class="search" (ngSubmit)="search()" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input name="q" [(ngModel)]="query" [placeholder]="'nav.search_placeholder' | t" autocomplete="off" />
  </form>

  <div class="right">
    <span class="api" [class.on]="apiOnline() === true" [class.off]="apiOnline() === false" [title]="'GET /api/health/'">
      <i></i>{{ apiOnline() === false ? ('api.offline' | t) : ('api.online' | t) }}
    </span>
    <button type="button" class="theme" (click)="theme.toggle()"
            [title]="theme.theme() === 'dark' ? ('theme.to_light' | t) : ('theme.to_dark' | t)"
            [attr.aria-label]="theme.theme() === 'dark' ? ('theme.to_light' | t) : ('theme.to_dark' | t)">
      @if (theme.theme() === 'dark') {
        <!-- sun: click to go light -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      } @else {
        <!-- moon: click to go dark -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      }
    </button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" [class.active]="i18n.lang() === 'en'" (click)="setLang('en')">EN</button>
      <button type="button" [class.active]="i18n.lang() === 'ru'" (click)="setLang('ru')">RU</button>
    </div>
  </div>
</header>
