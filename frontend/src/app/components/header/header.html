<header class="bar">
  <a routerLink="/" class="logo" aria-label="BIS AutoShop home">
    <span class="logo-mark">BIS</span><span class="logo-word">AUTO<b>SHOP</b></span>
  </a>

  <form class="search" (ngSubmit)="search()" role="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input name="q" [(ngModel)]="query" [placeholder]="'nav.search_placeholder' | t" autocomplete="off" />
  </form>

  <div class="right">
    <span class="api" [class.on]="apiOnline() === true" [class.off]="apiOnline() === false" [title]="'GET /api/health/'">
      <i></i>{{ apiOnline() === false ? ('api.offline' | t) : ('api.online' | t) }}
    </span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" [class.active]="i18n.lang() === 'en'" (click)="setLang('en')">EN</button>
      <button type="button" [class.active]="i18n.lang() === 'ru'" (click)="setLang('ru')">RU</button>
    </div>
  </div>
</header>
